services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ytasty
      POSTGRES_PASSWORD: ytasty
      POSTGRES_DB: ytasty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/code/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
